stages:
  download_smard:
    cmd: uv run python pipeline/01_download_smard.py
    deps:
      - pipeline/01_download_smard.py
      - dhf/smard.py
    outs:
      - data/downloads/smard/pv.parquet:
          persist: true
      - data/downloads/smard/wind_onshore.parquet:
          persist: true
      - data/downloads/smard/wind_offshore.parquet:
          persist: true
      - data/downloads/smard/load.parquet:
          persist: true

  build_target_panel:
    cmd: uv run python pipeline/02_build_target_panel.py
    deps:
      - pipeline/02_build_target_panel.py
      - data/downloads/smard/pv.parquet
      - data/downloads/smard/wind_onshore.parquet
      - data/downloads/smard/wind_offshore.parquet
      - data/downloads/smard/load.parquet
    outs:
      - data/processed/target_panel.parquet

  eda:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/03_eda.ipynb
      pipeline/03_eda.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/03_eda.ipynb
    deps:
      - pipeline/03_eda.py
      - dhf/splits.py
      - dhf/viz.py
      - data/downloads/smard/pv.parquet
      - data/downloads/smard/wind_onshore.parquet
      - data/downloads/smard/wind_offshore.parquet
      - data/downloads/smard/load.parquet
      - data/processed/target_panel.parquet
    outs:
      - book/notebooks/03_eda.ipynb:
          cache: false
      - output/images/03_data_availability.png:
          cache: false
      - output/images/03_headline_variables_timeseries.png:
          cache: false
      - output/images/03_rolling_volatility.png:
          cache: false
      - output/images/03_doy_std.png:
          cache: false
      - output/images/03_renewables_vs_demand.png:
          cache: false
      - output/images/03_renewable_share_of_load.png:
          cache: false

  baseline_linear_regression:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/04_baseline_linear_regression.ipynb
      pipeline/04_baseline_linear_regression.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/04_baseline_linear_regression.ipynb
    deps:
      - pipeline/04_baseline_linear_regression.py
      - dhf/features.py
      - dhf/splits.py
      - dhf/viz.py
      - dhf/reporting.py
      - dhf/scenarios.py
      - data/processed/target_panel.parquet
    outs:
      - book/notebooks/04_baseline_linear_regression.ipynb:
          cache: false
      - output/images/04_lr_mae_by_horizon.png:
          cache: false
      - output/images/04_lr_actual_vs_predicted_summer.png:
          cache: false
      - output/images/04_lr_actual_vs_predicted_winter.png:
          cache: false
      - output/images/04_lr_scatter_actual_vs_predicted.png:
          cache: false
      - output/images/04_lr_rolling_error.png:
          cache: false
      - output/images/04_lr_feature_importance.png:
          cache: false
      - data/processed/results/baseline_linear_regression.parquet

  baseline_lightgbm:
    cmd: >-

version: 1
project:
  title: Delu Headline Forecast
  authors:
    - name: Your Name
  copyright: '2026'
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  github: cgroll/delu-headline-forecast
  toc:
    - file: markdown/index.md
    - title: EDA
      children:
        - file: notebooks/03_eda.ipynb
        - file: notebooks/09_pecd_zones_eda.ipynb
        - file: notebooks/12_pecd_mastr_comparison_eda.ipynb
    - title: Baseline Forecasts
      children:
        - file: notebooks/04_baseline_linear_regression.ipynb
        - file: notebooks/05_baseline_lightgbm.ipynb
    - title: Phase 2 - Weather Value Check
      children:
        - file: notebooks/13_perfect_foresight_weather_lightgbm.ipynb
        - file: notebooks/16_perfect_foresight_weather_lightgbm_quarterly_refit.ipynb
        - file: notebooks/17_perfect_foresight_weather_xgboost_quarterly_refit.ipynb
        - file: notebooks/18_perfect_foresight_weather_catboost_quarterly_refit.ipynb
    - title: Scenario Overview
      children:
        - file: notebooks/06_scenario_overview_tables.ipynb
        - file: notebooks/07_scenario_overview_lead_times.ipynb
site:
  options:
    folders: true
  template: https://github.com/jupyter-book/myst-theme/releases/download/myst-to-react%401.4.1/book-theme.zip
